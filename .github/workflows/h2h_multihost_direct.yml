name: H2H Cross-Host Distribution (direct runner)

on:
  workflow_dispatch:

  push:
    branches:
      - V11

  pull_request:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day

permissions:
  contents: read

jobs:
  h2h_dist:
    name: H2H cross-host sample collection (direct)
    runs-on: linux-x86-ct5lp-4tpu-x4
    timeout-minutes: 180
    container:
      image: us-central1-docker.pkg.dev/wyzhang-dev/quickstart-docker-repo/ml-build:939285342
    env:
      WORKLOAD_ARTIFACTS_DIR: ${{ github.workspace }}/h2h_artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify this host
        id: rank
        run: |
          HN="$(hostname)"
          RANK="${HN##*-}"
          [[ "$RANK" =~ ^[0-9]+$ ]] || RANK="unknown"
          echo "rank=$RANK" >> "$GITHUB_OUTPUT"
          echo "this host is rank $RANK ($HN)"
          mkdir -p "$WORKLOAD_ARTIFACTS_DIR"

      - name: Collect H2H samples
        run: |
          bazel run -c opt --config=oss --config=ci \
            //tpu_raiden/benchmarks:h2h_cpp_gate -- \
            --multihost \
            --analyze \
            --iters=${{ inputs.iters }} \
            --timeout_s=${{ inputs.timeout_s }} \
            --dump=h2h_cpp_samples.csv \
            2>&1 | tee "$WORKLOAD_ARTIFACTS_DIR/h2h_dist.log"

      - name: Upload samples + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2h-dist-rank-${{ steps.rank.outputs.rank }}
          path: ${{ github.workspace }}/h2h_artifacts/
          if-no-files-found: warn
