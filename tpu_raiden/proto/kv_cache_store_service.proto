syntax = "proto3";

package tpu_raiden.kv_cache.proto;

import "tpu_raiden/proto/worker_service.proto";
import "tpu_raiden/rpc/raiden_service.proto";

option java_multiple_files = true;
option java_outer_classname = "KVCacheStoreServiceProto";

// Service exposing remote access to KV cache block transfers.
service KVCacheStoreService {
  // Fetches remote KV cache blocks to local host memory or device memory.
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

// Request to fetch one or more KV cache blocks by hash.
message FetchRequest {
  // Required: Sequence of block hashes to retrieve from the remote server.
  repeated string block_hashes = 1;

  // Optional: Physical device block IDs on the destination TPU.
  // - If NON-EMPTY: Target memory is device buffer (HBM). Must match
  // block_hashes length.
  // - If EMPTY: Target memory is local host buffer (DRAM).
  repeated int32 device_block_ids = 2;

  // Optional: Host block IDs as a sanity check.
  // - If NON-EMPTY: Must match block_hashes size.
  repeated int32 host_block_ids = 3;

  // Target destination info: Unique RaidenId of the client node initiating the
  // fetch.
  tpu_raiden.rpc.RaidenIdProto client_raiden_id = 4;

  // Data-plane transfer endpoints of the CLIENT (the node the bytes are
  // written into), one group per worker, tagged with node_id.
  repeated tpu_raiden.proto.RaidenWorkerEndpointsProto client_worker_endpoints = 5;
}

// Response describing the outcome of a fetch request.
message FetchResponse {
  // List of block hashes that were successfully fetched into the target buffer.
  repeated string done_block_hashes = 1;

  // List of block hashes that failed to be fetched.
  repeated string failed_block_hashes = 2;

  // Error status code or message for detailed reporting.
  string error_message = 3;
}
